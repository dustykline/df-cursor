<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1612">
<title>Dog meds</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-rounded, -apple-system, system-ui, sans-serif; background: #1a1612; color: #f4efe6; min-height: 100dvh; }
  header { position: sticky; top: 0; z-index: 2; padding: 18px 20px 12px; background: #1a1612; border-bottom: 1px solid #3a3228; }
  h1 { margin: 0; font-size: 1.75rem; }
  .sub { margin: 6px 0 0; color: #c4b8a5; }
  main { padding: 16px 16px 32px; }
  .day { margin: 22px 4px 10px; color: #c4b8a5; font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .day.today { color: #f2c14e; }
  button.dose { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 16px; text-align: left; border: 0; border-radius: 18px; padding: 20px 22px; margin: 0 0 12px; min-height: 84px; font: inherit; font-size: 1.25rem; background: #3b2a1c; color: #fff7ea; }
  button.dose:active { transform: scale(0.99); }
  .left { display: flex; flex-direction: column; gap: 4px; }
  .name { font-weight: 700; }
  .meta { font-size: 0.95rem; color: #e6d3b8; }
  .mark { width: 44px; height: 44px; border-radius: 12px; background: #2a211a; display: grid; place-items: center; font-size: 1.4rem; }
  button.dose.overdue { background: #5a241c; }
  button.dose.done { background: #1d3326; color: #c5d9cc; }
  button.dose.done .name { text-decoration: line-through; }
  .empty { padding: 40px 12px; text-align: center; color: #c4b8a5; font-size: 1.2rem; }
  .err { margin: 12px 16px; padding: 14px 16px; background: #5a241c; border-radius: 12px; }
</style>
</head>
<body>
<header>
  <h1>Dog meds</h1>
  <p class="sub" id="sub">Loading…</p>
</header>
<div id="err" hidden class="err"></div>
<main id="main"></main>
<script>
const TZ = "America/Chicago";
const API = "https://iycynwiwptthcovqeigj.supabase.co/functions/v1/dog-meds";
const token = new URLSearchParams(location.search).get("k") || "";
function apiUrl() { return API + "?k=" + encodeURIComponent(token); }
function dateKey(iso) { return new Date(iso).toLocaleDateString("en-CA", { timeZone: TZ }); }
function todayKey() { return new Date().toLocaleDateString("en-CA", { timeZone: TZ }); }
function dayLabel(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d, 12)).toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric", timeZone: "UTC" });
}
function slotLabel(slot) { return slot === "am" ? "Morning" : "Evening"; }
function remaining(doses) {
  const map = {};
  for (const x of doses) {
    map[x.med] = map[x.med] || { open: 0, n: 0 };
    map[x.med].n++;
    if (!x.given_at) map[x.med].open++;
  }
  return Object.entries(map).map(([med, v]) => v.open + "/" + v.n + " " + med).join("  \u00b7  ");
}
function render(doses) {
  const today = todayKey();
  const now = Date.now();
  const groups = new Map();
  for (const dose of doses) {
    const k = dateKey(dose.scheduled_at);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(dose);
  }
  const main = document.getElementById("main");
  main.innerHTML = "";
  document.getElementById("sub").textContent = remaining(doses);
  const keys = [...groups.keys()].sort();
  if (!doses.some(d => !d.given_at)) {
    main.innerHTML = '<p class="empty">All done. Good dog.</p>';
  }
  for (const key of keys) {
    const h = document.createElement("div");
    h.className = "day" + (key === today ? " today" : "");
    h.textContent = (key === today ? "Today \u00b7 " : "") + dayLabel(key);
    main.appendChild(h);
    for (const dose of groups.get(key)) {
      const due = !dose.given_at && new Date(dose.scheduled_at).getTime() <= now;
      const btn = document.createElement("button");
      btn.className = "dose" + (dose.given_at ? " done" : due ? " overdue" : "");
      btn.type = "button";
      btn.innerHTML = '<span class="left"><span class="name"></span><span class="meta"></span></span><span class="mark"></span>';
      btn.querySelector(".name").textContent = dose.med;
      btn.querySelector(".meta").textContent = slotLabel(dose.slot) + (dose.dose_note ? " \u00b7 " + dose.dose_note : "");
      btn.querySelector(".mark").textContent = dose.given_at ? "\u2713" : "\u25cb";
      btn.addEventListener("click", () => toggle(dose.id));
      main.appendChild(btn);
    }
  }
}
async function load() {
  const err = document.getElementById("err");
  err.hidden = true;
  try {
    const r = await fetch(apiUrl(), { cache: "no-store" });
    if (!r.ok) throw new Error("load failed");
    render(await r.json());
  } catch (e) {
    err.hidden = false;
    err.textContent = "Could not load meds. Check the link and try again.";
  }
}
async function toggle(id) {
  const r = await fetch(apiUrl(), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ id }),
  });
  if (!r.ok) {
    document.getElementById("err").hidden = false;
    document.getElementById("err").textContent = "Tap did not save. Try once more.";
    return;
  }
  load();
}
if (!token) document.getElementById("sub").textContent = "Missing link token.";
else { load(); setInterval(load, 60000); }
</script>
</body>
</html>
